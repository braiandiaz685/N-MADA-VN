<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Juegos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <!-- FILTROS -->
    <div class="filtros">
      <input type="text" id="input-buscador" placeholder="Buscar juego por título...">
      <select id="select-categoria">
        <option value="todas">Todas las categorías</option>
      </select>
    </div>

    <!-- CONTENEDOR DE TARJETAS -->
    <div id="contenedor-juegos"></div>

    <!-- PAGINACIÓN -->
    <div id="paginacion"></div>
  </div>

  <script>
    let paginaActual = 1;
    const juegosPorPagina = 8;
    let listaJuegos = [];
    let juegosFiltrados = [];

    const buscador = document.getElementById('input-buscador');
    const selectorCategoria = document.getElementById('select-categoria');
    const contenedor = document.getElementById('contenedor-juegos');
    const paginador = document.getElementById('paginacion');

    // Cargar los datos desde juegos.json
    fetch('juegos.json')
      .then(response => response.json())
      .then(data => {
        listaJuegos = data;
        juegosFiltrados = data;
        poblarCategorias(listaJuegos);
        mostrarPagina(paginaActual);
      })
      .catch(error => console.error('Error al cargar juegos.json:', error));

    // Llenar el desplegable de categorías dinámicamente
    function poblarCategorias(juegos) {
      const categoriasUnicas = [...new Set(juegos.map(juego => juego.categoria))];
      selectorCategoria.innerHTML = '<option value="todas">Todas las categorías</option>';

      categoriasUnicas.forEach(categoria => {
        if (categoria) {
          const opcion = document.createElement('option');
          opcion.value = categoria;
          opcion.textContent = categoria;
          selectorCategoria.appendChild(opcion);
        }
      });
    }

    // Filtrar por texto y categoría
    function aplicarFiltros() {
      const texto = buscador.value.toLowerCase().trim();
      const categoriaSeleccionada = selectorCategoria.value;

      juegosFiltrados = listaJuegos.filter(juego => {
        const coincideTexto = juego.titulo.toLowerCase().includes(texto);
        const coincideCategoria = categoriaSeleccionada === 'todas' || juego.categoria === categoriaSeleccionada;
        return coincideTexto && coincideCategoria;
      });

      paginaActual = 1;
      mostrarPagina(paginaActual);
    }

    buscador.addEventListener('input', aplicarFiltros);
    selectorCategoria.addEventListener('change', aplicarFiltros);

    // Renderizar tarjetas y paginación
    function mostrarPagina(pagina) {
      paginaActual = pagina;
      contenedor.innerHTML = '';
      paginador.innerHTML = '';

      if (juegosFiltrados.length === 0) {
        contenedor.innerHTML = '<p class="sin-resultados">No se encontraron juegos con esos criterios.</p>';
        return;
      }

      const inicio = (pagina - 1) * juegosPorPagina;
      const fin = inicio + juegosPorPagina;
      const juegosPaginados = juegosFiltrados.slice(inicio, fin);

      // Render de tarjetas
      juegosPaginados.forEach(juego => {
        const urlDescarga = juego.linkDescarga || '#';

        contenedor.innerHTML += `
          <div class="tarjeta-juego">
            <div>
              <div class="portada-contenedor">
                <img src="${juego.imagen}" alt="${juego.titulo}" class="portada-imagen" loading="lazy">
              </div>
              <div class="contenido-juego">
                <h3>${juego.titulo}</h3>
                <span class="badge-categoria">${juego.categoria}</span>
              </div>
            </div>
            <a href="${urlDescarga}" class="btn-descargar" target="_blank" rel="noopener noreferrer">
              Descargar
            </a>
          </div>
        `;
      });

      // Render de botones de paginación
      const totalPaginas = Math.ceil(juegosFiltrados.length / juegosPorPagina);

      const btnAnterior = document.createElement('button');
      btnAnterior.textContent = '« Anterior';
      btnAnterior.disabled = paginaActual === 1;
      btnAnterior.addEventListener('click', () => {
        if (paginaActual > 1) mostrarPagina(paginaActual - 1);
      });
      paginador.appendChild(btnAnterior);

      for (let i = 1; i <= totalPaginas; i++) {
        const boton = document.createElement('button');
        boton.textContent = i;
        if (i === paginaActual) boton.classList.add('activo');

        boton.addEventListener('click', () => mostrarPagina(i));
        paginador.appendChild(boton);
      }

      const btnSiguiente = document.createElement('button');
      btnSiguiente.textContent = 'Siguiente »';
      btnSiguiente.disabled = paginaActual === totalPaginas;
      btnSiguiente.addEventListener('click', () => {
        if (paginaActual < totalPaginas) mostrarPagina(paginaActual + 1);
      });
      paginador.appendChild(btnSiguiente);
    }
  </script>
</body>
</html>
